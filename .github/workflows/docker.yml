name: Container image

# Builds the container edition of an existing version of Cyklo.
# Run manually: GitHub -> Actions -> "Container image" -> Run workflow, and enter the version (for example 0.2.0).
# It also runs when a tag such as v0.2.0 is pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number of the image (same as the SPK version, e.g. 0.2.0)"
        required: true
        default: "0.2.0"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ inputs.version }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: t
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "tags=$IMG:${{ steps.v.outputs.version }},$IMG:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.t.outputs.tags }}
